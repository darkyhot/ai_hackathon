# Direct HTTPS ingress. The Cloudflare Tunnel can remain available for rollback.
# Install in /etc/nginx/sites-available/mesto after issuing the certificate.
map $http_upgrade $mesto_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name domclick-agent.cikada-tech.com;

    # Certbot writes tokens into frontend/.well-known/acme-challenge/.
    # The existing application serves them both through the tunnel and directly.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 308 https://domclick-agent.cikada-tech.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name domclick-agent.cikada-tech.com;

    ssl_certificate /etc/letsencrypt/live/domclick-agent.cikada-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domclick-agent.cikada-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MestoTLS:10m;
    ssl_session_timeout 1d;

    # The application accepts at most 5 MiB of recorded audio.
    client_max_body_size 6m;
    access_log /var/log/nginx/mesto-access.log;
    error_log /var/log/nginx/mesto-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mesto_connection_upgrade;
        proxy_set_header CF-Connecting-IP '';

        # Deliver agent events immediately and keep SSE connections alive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }
}
