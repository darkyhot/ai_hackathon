<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Агент сделки — Домклик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Агент сделки</span>
      <span class="brand-sub">для Домклик</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-tab="deal" aria-selected="true">Покупка квартиры</button>
      <button class="tab" role="tab" data-tab="economics" aria-selected="false">Экономика для Сбера</button>
    </nav>
    <div class="topbar-tools">
      <span class="provider" id="provider" title="Какая модель ведёт агента">…</span>
      <button class="voice-toggle" id="voiceToggle" aria-pressed="true" title="Озвучивать звонок">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <span>Голос</span>
      </button>
    </div>
  </header>

  <main id="view-deal" class="workspace">
    <aside class="chat" aria-label="Диалог с агентом">
      <div class="chat-head">
        <span>Диалог с агентом</span>
        <button class="link-btn" id="resetBtn" hidden>Новый запрос</button>
      </div>
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="query" rows="2" placeholder="Например: ищу 2-комнатную в Казани до 9 млн рядом со школой" aria-label="Сообщение агенту"></textarea>
        <div class="composer-row">
          <button type="button" class="mic" id="micBtn" title="Сказать голосом" aria-label="Сказать голосом" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="talk-btn" id="talkBtn" aria-pressed="false" title="Разговаривать с агентом голосом, без кнопок">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            <span>Разговор</span>
          </button>
          <button type="submit" class="btn btn-primary" id="sendBtn">Поручить агенту</button>
        </div>
      </form>
      <div class="talk" id="talkPanel" data-state="off" hidden>
        <button type="button" class="talk-orb" id="talkOrb" aria-label="Перебить агента или закончить фразу">
          <span class="talk-ring"></span><span class="talk-core"></span>
        </button>
        <div class="talk-text" aria-live="polite">
          <strong id="talkState">Слушаю</strong>
          <span id="talkHint">Говорите — отвечу, когда замолчите</span>
        </div>
        <button type="button" class="btn btn-ghost btn-small" id="talkEnd">Завершить</button>
      </div>
    </aside>

    <section class="stage" aria-label="Ход сделки">
      <ol class="stepper" id="stepper"></ol>
      <div class="stage-body" id="stage"></div>
    </section>
  </main>

  <main id="view-economics" class="economics" hidden></main>

  <footer class="footnote">Прототип для хакатона. Объявления — с Циана (без телефонов продавцов); звонок продавцу — симуляция; ставки, доходности и тарифы — допущения.</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
